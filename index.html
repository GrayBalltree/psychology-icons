<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理学主题图标库</title>
<style>
  :root{
    --ink:#31435B; --blue:#4A90D9; --teal:#3AA6A6;
    --bg:#F6F8FB; --card:#FFFFFF; --line:#E3E9F2; --muted:#7A8AA0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(135deg,#2E4A6B,#3D6B8E 60%,#3AA6A6);color:#fff;padding:40px 24px 32px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header h1{font-size:25px;letter-spacing:1px}
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 0}
  .toolbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #search{flex:1;min-width:200px;padding:10px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;outline:none;background:#fff;color:var(--ink)}
  #search:focus{border-color:var(--blue)}
  .chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:26px 0 60px}
  .note{font-size:12.5px;color:var(--muted);background:#EDF3FA;border-radius:10px;padding:10px 14px;margin-top:14px}
  .cat-title{font-size:17px;font-weight:600;margin:28px 0 4px;display:flex;align-items:center;gap:10px}
  .cat-title .bar{width:5px;height:18px;border-radius:3px;background:var(--blue)}
  .cat-count{font-size:12px;color:var(--muted);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px 12px;text-align:center;cursor:pointer;transition:all .18s ease;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(49,67,91,.12);border-color:#C9D8EC}
  .card .icobox{width:72px;height:72px;margin:0 auto;display:flex;align-items:center;justify-content:center}
  .card .icobox img{max-width:72px;max-height:72px}
  .card .zh{font-size:12.5px;margin-top:8px;line-height:1.35}
  .card .slug{font-size:10.5px;color:var(--muted);margin-top:2px;font-family:Consolas,monospace}
  .card .quick{position:absolute;top:7px;right:7px;display:none;gap:4px}
  .card:hover .quick{display:flex}
  .qbtn{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:10.5px;padding:3px 7px;cursor:pointer;color:var(--ink)}
  .qbtn:hover{background:var(--ink);color:#fff}
  .swatches{position:absolute;bottom:7px;left:0;right:0;display:none;justify-content:center;gap:6px}
  .card:hover .swatches{display:flex}
  .sw{width:15px;height:15px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}
  .panel-sw{display:flex;gap:8px;margin-top:10px}
  .panel-sw .sw{width:20px;height:20px}
  #overlay{position:fixed;inset:0;background:rgba(30,42,60,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  #overlay.show{display:flex}
  #panel{background:#fff;border-radius:18px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:26px}
  #panel .big{display:flex;gap:22px;align-items:center}
  #panel .preview{width:132px;height:132px;flex:none;background:repeating-conic-gradient(#EDF1F7 0 25%,#fff 0 50%) 0 0/20px 20px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:12px}
  #panel .preview img{max-width:110px;max-height:110px}
  #panel h2{font-size:19px}
  #panel .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
  .btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{padding:9px 18px;border-radius:9px;border:none;font-size:13.5px;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.ghost{background:#EDF3FA;color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>心理学主题图标库</h1>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <input id="search" type="text" placeholder="搜索图标，如：正念、fMRI、工作记忆…">
    <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>
</div>

<main class="wrap">
  <div id="main" style="margin-top:6px"></div>
</main>

<footer><div class="wrap">透明背景 PNG · 可直接粘贴到 PPT / Word · 点击图标可复制或下载单张</div></footer>

<div id="overlay">
  <div id="panel">
    <div class="big">
      <div class="preview" id="p-preview"></div>
      <div>
        <h2 id="p-title"></h2>
        <div class="meta" id="p-meta"></div>
        <div class="btnrow">
          <button class="btn primary" id="p-copy">复制 PNG</button>
          <button class="btn ghost" id="p-download">下载 PNG</button>
          <button class="btn ghost" id="p-close">关闭</button>
        </div>
        <div class="panel-sw" id="p-sw"></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
let DATA=[], curCat="全部", curQ="", curItem=null, curPath=null;

fetch("manifest2.json").then(r=>r.json()).then(data=>{
  DATA=data;
  const cats=[...new Set(data.map(d=>d.cat))];
  const chips=document.getElementById("chips");
  ["全部",...cats].forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+(c==="全部"?" active":""); b.textContent=c;
    b.onclick=()=>{curCat=c;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();};
    chips.appendChild(b);
  });
  render();
});

document.getElementById("search").addEventListener("input",e=>{curQ=e.target.value.trim().toLowerCase();render();});

function render(){
  const main=document.getElementById("main"); main.innerHTML="";
  const cats=[...new Set(DATA.map(d=>d.cat))].filter(c=>curCat==="全部"||curCat===c);
  cats.forEach(cat=>{
    const items=DATA.filter(d=>d.cat===cat && (!curQ || d.zh.toLowerCase().includes(curQ)||d.slug.toLowerCase().includes(curQ)));
    if(!items.length) return;
    const h=document.createElement("div"); h.className="cat-title";
    h.innerHTML=`<span class="bar"></span>${cat}<span class="cat-count">${items.length} 个</span>`;
    main.appendChild(h);
    const grid=document.createElement("div"); grid.className="grid";
    items.forEach(d=>{
      const card=document.createElement("div");
      card.className="card";
      card.dataset.path=d.path;
      let swHTML="";
      if(d.variants){
        swHTML=`<div class="swatches">`+d.variants.map((v,i)=>
          `<span class="sw${i===0?" on":""}" data-i="${i}" style="background:${v.color}" title="${v.name}"></span>`).join("")+`</div>`;
      }
      card.innerHTML=`<div class="quick"><button class="qbtn" data-a="copy">复制</button><button class="qbtn" data-a="dl">下载</button></div>
        <div class="icobox"><img src="${d.path}" loading="lazy"></div><div class="zh">${d.zh}</div><div class="slug">${d.slug}</div>`+swHTML;
      if(d.variants){
        card.querySelectorAll(".sw").forEach(sw=>{
          sw.onclick=e=>{
            e.stopPropagation();
            const v=d.variants[+sw.dataset.i];
            card.dataset.path=v.path;
            card.querySelector("img").src=v.path;
            card.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));
            sw.classList.add("on");
          };
        });
      }
      card.querySelector('[data-a="copy"]').onclick=e=>{e.stopPropagation();copyPNG(d,card.dataset.path);};
      card.querySelector('[data-a="dl"]').onclick=e=>{e.stopPropagation();downloadPNG(d,card.dataset.path);};
      card.onclick=()=>openPanel(d);
      grid.appendChild(card);
    });
    main.appendChild(grid);
  });
  if(!main.children.length) main.innerHTML="<p style='color:var(--muted);padding:30px 0'>没有匹配的图标。</p>";
}

function openPanel(d){
  curItem=d; curPath=d.path;
  document.getElementById("p-preview").innerHTML=`<img src="${d.path}">`;
  document.getElementById("p-title").textContent=d.zh;
  document.getElementById("p-meta").textContent=`${d.cat} · ${d.path}`;
  const sw=document.getElementById("p-sw"); sw.innerHTML="";
  if(d.variants){
    d.variants.forEach((v,i)=>{
      const s=document.createElement("span");
      s.className="sw"+(i===0?" on":""); s.style.background=v.color; s.title=v.name;
      s.onclick=()=>{
        curPath=v.path;
        document.querySelector("#p-preview img").src=v.path;
        document.getElementById("p-meta").textContent=`${d.cat} · ${v.path}`;
        sw.querySelectorAll(".sw").forEach(x=>x.classList.remove("on")); s.classList.add("on");
      };
      sw.appendChild(s);
    });
  }
  document.getElementById("overlay").classList.add("show");
}
document.getElementById("p-close").onclick=()=>document.getElementById("overlay").classList.remove("show");
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")e.target.classList.remove("show");};

async function copyPNG(d,path){
  try{
    const r = await fetch(path||d.path);
    const blob = await r.blob();
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    toast("已复制 PNG 图片，可直接粘贴");
  }catch(e){ toast("复制失败，请使用下载"); }
}
document.getElementById("p-copy").onclick=()=>copyPNG(curItem,curPath);
function downloadPNG(d,path){
  const a=document.createElement("a");
  a.href=path||d.path; a.download=d.slug+".png"; a.click();
  toast("已开始下载 "+d.slug+".png");
}
document.getElementById("p-download").onclick=()=>downloadPNG(curItem);

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity=0,2000);
}
</script>
</body>
</html>
